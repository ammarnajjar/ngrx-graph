name: checks

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  checks:
    strategy:
      matrix:
        node_version: [lts/-1, lts/*]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test
      - run: npm run lint
